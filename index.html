<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Second Brain</title>
<style>
:root{--bg:#05070d;--fg:#cfe8ff;--dim:#6b7f99;--ln:#1b2a3d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--ln)}
h1{font-size:14px;margin:0 8px 0 0;letter-spacing:.14em;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
select,button,input[type=text]{background:#0b1220;color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;font:inherit}
button{cursor:pointer}button:hover{border-color:#22d3ee}
main{display:grid;grid-template-columns:1fr;gap:10px;padding:10px 14px}
@media(min-width:900px){main{grid-template-columns:1.5fr 1fr}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.card{border:1px solid var(--ln);border-radius:8px;padding:10px;background:#080d18;min-width:0}
canvas{width:100%;display:block}
#tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.t b{display:block;font-size:18px}.t span{color:var(--dim)}
#bar{height:10px;border-radius:5px;background:#0b1220;overflow:hidden;margin-top:8px}
#fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#4ade80,#fbbf24,#f472b6);transition:width .2s}
#q{width:100%;margin-bottom:6px}
#out{white-space:pre-wrap;min-height:120px;max-height:50vh;overflow:auto;margin-top:8px}
#hits{color:var(--dim);margin-top:8px}
.dim{color:var(--dim)}
</style></head><body>
<header><h1>SECOND BRAIN</h1>
<select id="model"><option>loading models…</option></select>
<select id="ctx"><option>4096</option><option selected>8192</option><option>16384</option><option>32768</option></select>
<label class="dim"><input type="checkbox" id="learn" checked> learn</label>
<button id="re">reindex vault</button><span id="vs" class="dim"></span></header>
<main>
<div class="col">
 <div class="card"><canvas id="flow"></canvas></div>
 <div class="card"><div id="tiles">
  <div class="t"><b id="t1">–</b><span>context window</span></div><div class="t"><b id="t2">–</b><span>tok/s</span></div>
  <div class="t"><b id="t3">–</b><span>latency</span></div><div class="t"><b id="t4">–</b><span>prompt tok</span></div>
  <div class="t"><b id="t5">–</b><span>output tok</span></div><div class="t"><b id="t6">–</b><span>notes hit</span></div></div>
  <div id="bar"><div id="fill"></div></div></div>
 <div class="card"><div class="dim">last 40 runs · bars = prompt (cyan) + output (pink) tokens · line = tok/s</div><canvas id="an" style="height:130px"></canvas><div id="sum" class="dim"></div></div>
</div>
<div class="col"><div class="card">
 <input id="q" type="text" placeholder="Ask your model..." autocomplete="off">
 <button id="ask">ask</button>
 <div id="hits"></div><div id="out"></div></div></div>
</main>
<script>
const $=i=>document.getElementById(i),dpr=Math.min(devicePixelRatio||1,2);
const C={q:'#22d3ee',r:'#4ade80',n:'#fbbf24',c:'#fb923c',m:'#f472b6',a:'#a78bfa',v:'#60a5fa'};
const S={q:[.08,.4,'QUERY'],r:[.27,.4,'RETRIEVE'],c:[.62,.4,'CONTEXT'],m:[.8,.4,'MODEL'],a:[.93,.4,'ANSWER'],v:[.27,.9,'VAULT']};
const fl=$('flow'),fx=fl.getContext('2d');let W,H,notes=[],P=[],glow={},live={o:0,t0:0};
function size(){W=fl.clientWidth;H=W<520?260:320;fl.style.height=H+'px';fl.width=W*dpr;fl.height=H*dpr;fx.setTransform(dpr,0,0,dpr,0,0);an()}
addEventListener('resize',size);
const pos=k=>[S[k][0]*W,S[k][1]*H],np=(i,n)=>[.45*W,H*(n<2?.4:.08+.64*i/(n-1))];
const bez=(a,b,t)=>{const m=[(a[0]+b[0])/2,(a[1]+b[1])/2-(b[0]-a[0])*.12],u=1-t;return[u*u*a[0]+2*u*t*m[0]+t*t*b[0],u*u*a[1]+2*u*t*m[1]+t*t*b[1]]};
const pulse=(a,b,col,d=0)=>setTimeout(()=>P.push({a,b,col,t:0,s:.012+Math.random()*.01}),d);
const edge=(a,b,col,al)=>{fx.strokeStyle=col;fx.globalAlpha=al;fx.beginPath();for(let i=0;i<=24;i++){const p=bez(a,b,i/24);i?fx.lineTo(...p):fx.moveTo(...p)}fx.stroke()};
function draw(){
 fx.globalCompositeOperation='source-over';fx.globalAlpha=1;fx.fillStyle='rgba(8,13,24,.35)';fx.fillRect(0,0,W,H);fx.globalCompositeOperation='lighter';
 const L=[['q','r'],['c','m'],['m','a'],['a','v'],['v','r']];L.forEach(([a,b])=>edge(pos(a),pos(b),C[b],.22));
 notes.forEach((n,i)=>{const p=np(i,notes.length);edge(pos('r'),p,C.n,.15+n.sc*.2);edge(p,pos('c'),C.n,.15+n.sc*.2)});
 P=P.filter(p=>(p.t+=p.s)<1);P.forEach(p=>{[0,.04,.08].forEach((d,k)=>{const q=bez(p.a,p.b,Math.max(0,p.t-d));fx.globalAlpha=.9/(k+1);fx.fillStyle=p.col;fx.beginPath();fx.arc(q[0],q[1],3-k*.7,0,7);fx.fill()})});
 const node=(x,y,col,g,lab,r=7)=>{const R=r+g*12,gr=fx.createRadialGradient(x,y,0,x,y,R*3);gr.addColorStop(0,col+'aa');gr.addColorStop(1,col+'00');fx.globalAlpha=1;fx.fillStyle=gr;fx.beginPath();fx.arc(x,y,R*3,0,7);fx.fill();fx.fillStyle='#fff';fx.beginPath();fx.arc(x,y,r*.6,0,7);fx.fill();
  fx.globalCompositeOperation='source-over';fx.fillStyle=col;fx.font='10px ui-monospace,monospace';fx.textAlign='center';fx.fillText(lab,x,y+r+16);fx.globalCompositeOperation='lighter'};
 for(const k in S){glow[k]=(glow[k]||0)*.95;const[x,y]=pos(k);node(x,y,C[k],glow[k],S[k][2])}
 notes.forEach((n,i)=>{const[x,y]=np(i,notes.length);glow['n'+i]=(glow['n'+i]||0)*.95;node(x,y,C.n,glow['n'+i],n.path.split('/').pop().replace(/\.md$/,'').slice(0,14),4+n.sc*3)});
 requestAnimationFrame(draw)}
const fmt=n=>(+n).toLocaleString();
function tiles(p,o,ctx,tps,ms,nh){$('t1').textContent=Math.round((p+o)/ctx*100)+'%';$('fill').style.width=Math.min(100,(p+o)/ctx*100)+'%';$('t2').textContent=tps;$('t3').textContent=ms??'–';$('t4').textContent=fmt(p);$('t5').textContent=fmt(o);$('t6').textContent=nh??'–'}
function on(e){
 if(e.ev=='retrieve'){notes=e.hits.map(h=>({path:h.path,sc:Math.min(1,h.score/1.5)}));glow.r=1;
  e.hits.forEach((h,i)=>{glow['n'+i]=1;pulse(pos('r'),np(i,notes.length),C.n,i*120);pulse(np(i,notes.length),pos('c'),C.c,400+i*120)});setTimeout(()=>{glow.c=1;pulse(pos('c'),pos('m'),C.m)},700);
  $('hits').textContent=e.hits.length?e.hits.map(h=>'▸ '+h.path+'  '+h.score).join('\n'):'no matching notes';$('hits').style.whiteSpace='pre-wrap';$('t6').textContent=e.hits.length}
 else if(e.ev=='token'){$('out').textContent+=e.t;live.o++;glow.m=glow.a=1;if(live.o%2==0)pulse(pos('m'),pos('a'),C.a);const s=(performance.now()-live.t0)/1000;$('t5').textContent=live.o;$('t2').textContent=(live.o/s).toFixed(1)}
 else if(e.ev=='done'){tiles(e.p,e.o,e.ctx,e.tps,e.ms);if(e.saved){glow.v=1;pulse(pos('a'),pos('v'),C.v);$('hits').textContent+='\n✎ saved to vault: '+e.saved}stats()}
 else if(e.ev=='error')$('out').textContent+='\n[error] '+e.msg}
async function ask(){const q=$('q').value.trim();if(!q)return;$('out').textContent='';$('hits').textContent='';live={o:0,t0:performance.now()};glow.q=1;pulse(pos('q'),pos('r'),C.q);
 try{const r=await fetch('/api/chat',{method:'POST',body:JSON.stringify({model:$('model').value,q,ctx:+$('ctx').value,learn:$('learn').checked})});
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n\n'))>=0){const l=buf.slice(0,i);buf=buf.slice(i+2);if(l.startsWith('data: '))on(JSON.parse(l.slice(6)))}}}
 catch(e){$('out').textContent='[error] '+e}}
$('ask').onclick=ask;$('q').onkeydown=e=>{if(e.key=='Enter')ask()};
$('re').onclick=async()=>{$('vs').textContent='indexing…';const r=await(await fetch('/api/reindex',{method:'POST',body:'{}'})).json();$('vs').textContent=`${r.notes} notes · ${r.chunks} chunks · ${r.embedded} embedded`};
const an_=$('an'),ax=an_.getContext('2d');let runs=[];
function an(){const w=an_.clientWidth,h=130;an_.width=w*dpr;an_.height=h*dpr;ax.setTransform(dpr,0,0,dpr,0,0);ax.clearRect(0,0,w,h);if(!runs.length)return;
 const mx=Math.max(...runs.map(r=>r[3]+r[4]),1),mt=Math.max(...runs.map(r=>r[6]),1),bw=w/(runs.length+1);
 runs.forEach((r,i)=>{const x=bw*(i+.5),hp=(r[3]/mx)*(h-10),ho=(r[4]/mx)*(h-10);ax.fillStyle='#22d3ee';ax.fillRect(x,h-hp,bw*.7,hp);ax.fillStyle='#f472b6';ax.fillRect(x,h-hp-ho,bw*.7,ho)});
 ax.strokeStyle='#fbbf24';ax.lineWidth=2;ax.beginPath();runs.forEach((r,i)=>{const x=bw*(i+.85),y=h-(r[6]/mt)*(h-10)-5;i?ax.lineTo(x,y):ax.moveTo(x,y)});ax.stroke()}
async function stats(){try{const s=await(await fetch('/api/stats')).json();runs=s.runs;an();$('vs').textContent=`${s.notes} notes · ${s.chunks} chunks`;
 const tt=runs.reduce((a,r)=>a+r[3]+r[4],0),av=runs.length?runs.reduce((a,r)=>a+r[6],0)/runs.length:0;$('sum').textContent=`${runs.length} runs · ${fmt(tt)} tokens · avg ${av.toFixed(1)} tok/s`}catch(e){}}
(async()=>{size();draw();stats();
 try{const m=await(await fetch('/api/models')).json();if(m.error)throw 0;$('model').innerHTML=m.map(x=>`<option>${x}</option>`).join('')||'<option>no models – run ollama pull</option>'}
 catch(e){$('model').innerHTML='<option>Ollama not reachable. Check if its running on port 11434</option>'}})();
</script></body></html>
